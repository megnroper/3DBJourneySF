<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3DB Agentic Customer Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen at a time. Story column | customer's phone | agent console. Slat-wipe transition between screens, like a blind closing and opening. */
:root{
  --paper:#EDF0EE; --surface:#F8FAF9; --raised:#FFFFFF; --ink:#182428; --muted:#56666A; --line:#D2D9D7;
  --brass:#8C6119; --agent:#2E55D6; --agent-soft:#E3E9FB; --human:#2D7A57; --human-soft:#E0F0E8;
  --warn:#AE4F1B; --warn-soft:#F8E6DA; --bubble-in:#2E55D6; --bubble-in-fg:#FFFFFF; --bubble-out:#E6EAE9;
  --phone:#1B2528; --slat:#D9DFDC; --today:#7D8583;
  --f-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Figtree', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101719; --surface:#172124; --raised:#1D292C; --ink:#E5ECEA; --muted:#9AA8AA; --line:#2B383B;
  --brass:#D6A553; --agent:#86A2FF; --agent-soft:#1F2A47; --human:#6CC79A; --human-soft:#173327;
  --warn:#E88F5A; --warn-soft:#3A2519; --bubble-in:#3D63E0; --bubble-in-fg:#FFFFFF; --bubble-out:#263337;
  --phone:#05090A; --slat:#223034; --today:#8E9794; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#101719; --surface:#172124; --raised:#1D292C; --ink:#E5ECEA; --muted:#9AA8AA; --line:#2B383B;
  --brass:#D6A553; --agent:#86A2FF; --agent-soft:#1F2A47; --human:#6CC79A; --human-soft:#173327;
  --warn:#E88F5A; --warn-soft:#3A2519; --bubble-in:#3D63E0; --bubble-in-fg:#FFFFFF; --bubble-out:#263337;
  --phone:#05090A; --slat:#223034; --today:#8E9794; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:clamp(16px,3vw,40px);padding-block:0 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--agent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-block:14px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;margin-right:auto}
.brand span{color:var(--muted);font-weight:500}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.mode button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nav{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--agent);border-color:var(--agent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.hint{font-size:12px;color:var(--muted)}
.track{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track button{flex:1 0 auto;min-width:64px;border:0;background:none;padding:6px 2px 0;text-align:left;display:flex;flex-direction:column;gap:6px}
.track i{display:block;height:4px;border-radius:2px;background:var(--line)}
.track b{font-weight:500;font-size:11.5px;color:var(--muted);white-space:nowrap}
.track button.done i{background:var(--muted)}
.track button.on i{background:var(--agent)}
.track button.on b{color:var(--ink);font-weight:700}

/* Stage area */
.stage{position:relative;padding-block:28px 8px;min-height:560px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) 340px minmax(0,1fr);gap:28px;align-items:start}
.story{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.story h2{font-size:clamp(28px,3.2vw,42px);line-height:1.08;font-weight:700}
.story p{margin:0;max-width:62ch;color:var(--ink)}
.today-tag{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px}
.why{border-left:3px solid var(--brass);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.why strong{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.why span{font-size:15px}
.why small{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips em{font-style:normal;font-size:12px;color:var(--muted);margin-right:4px}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--agent-soft);color:var(--agent)}

/* Photo slots */
.photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-width:100%;background:var(--slat)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;background:repeating-linear-gradient(180deg,var(--slat) 0 18px,var(--surface) 18px 20px);display:flex;align-items:flex-end;padding:12px}
.photo .ph span{font-family:var(--f-mono);font-size:11.5px;background:var(--raised);color:var(--muted);padding:5px 9px;border-radius:6px;border:1px solid var(--line)}

/* Phone */
.phone-wrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.phone{width:100%;max-width:340px;background:var(--phone);border-radius:38px;padding:10px;box-shadow:0 24px 50px -24px rgba(10,20,25,.45)}
.screen{background:var(--raised);border-radius:30px;height:560px;display:flex;flex-direction:column;overflow:hidden}
.ph-head{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.ph-head .notch{width:90px;height:22px;background:var(--phone);border-radius:0 0 14px 14px;margin:-16px 0 8px}
.ph-head b{font-size:14px}
.ph-head small{font-size:11.5px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{max-width:84%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.4}
.msg.out{align-self:flex-start;background:var(--bubble-out);border-bottom-left-radius:4px}
.msg.in{align-self:flex-end;background:var(--bubble-in);color:var(--bubble-in-fg);border-bottom-right-radius:4px}
.msg.human{align-self:flex-start;background:var(--human-soft);border-bottom-left-radius:4px}
.msg .who{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.msg.note{align-self:center;background:none;color:var(--muted);font-size:11.5px;text-align:center;padding:2px 8px}
.msg.card{align-self:stretch;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:6px}
.msg.card b{font-size:13px}
.msg.card .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-top:1px dashed var(--line);padding-top:5px}
.msg.card .row span:first-child{color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.opts span{font-size:12px;font-weight:600;border:1px solid var(--agent);color:var(--agent);border-radius:999px;padding:3px 10px}
.opts span.pick{background:var(--agent);color:#fff}
.msg.fresh{animation:rise .35s ease-out both}
.ph-empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--today);font-size:13px;padding:24px}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.stepper .count{min-width:auto}
.dim .screen{filter:grayscale(1);opacity:.75}

/* Console */
.console{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-width:0}
.c-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.c-head h3{font-size:15px}
.c-head .live{width:8px;height:8px;border-radius:50%;background:var(--human);box-shadow:0 0 0 3px var(--human-soft)}
.c-head small{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lines{list-style:none;margin:0;padding:8px 16px 14px;display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--agent)}
.line.data .dot{background:var(--brass)}
.line.human .dot{background:var(--human)}
.line.sys .dot{background:var(--muted)}
.line.warn .dot{background:var(--warn)}
.line .who{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.line .what{font-size:14px;font-weight:600}
.line .detail{font-size:13px;color:var(--muted)}
.line.fresh{animation:rise .4s ease-out both}
.line.fresh .dot{animation:pulse 1s ease-out 1}
.manual{list-style:none;margin:0;padding:10px 16px 16px;display:flex;flex-direction:column;gap:10px}
.manual li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14px}
.manual li::before{content:"";width:10px;height:10px;border:2px solid var(--today);border-radius:2px;margin-top:5px}
.stat{margin:0 16px 16px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.stat b{font-family:var(--f-display);font-size:24px;display:block;color:var(--warn)}
.own{border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.own h4{margin:0;font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.own ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.own li{background:var(--human-soft);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.own li{background:var(--bubble-out)}
.own li b{font-size:13.5px}
.chip.have{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:0 16px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Opener / persona / summary */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center;padding-block:24px}
.hero h1{font-size:clamp(36px,5vw,68px);line-height:1.02;font-weight:700}
.hero p{font-size:18px;color:var(--muted);max-width:52ch;margin:0}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.hero .copy{display:flex;flex-direction:column;gap:22px}
.hero .photo{aspect-ratio:4/3}
.persona{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:32px;align-items:start}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.profile-top{display:flex;gap:16px;align-items:center;padding:18px}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;flex:none}
.avatar .photo{aspect-ratio:1;border-radius:50%}
.avatar .photo .ph span{display:none}
.profile-top h3{font-size:24px}
.profile-top small{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.tiles div{padding:14px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.tiles div:last-child{border-right:0}
.tiles small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tiles b{font-size:15px}
.sources{border-top:1px solid var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.sources small{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.src{display:flex;flex-wrap:wrap;gap:6px}
.src span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--raised)}
.persona .right{display:flex;flex-direction:column;gap:18px}
.summary{display:flex;flex-direction:column;gap:28px}
.outcomes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.outcomes section{border-top:3px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.outcomes h3{font-size:19px}
.outcomes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.matrix{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.matrix th,.matrix td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left;white-space:nowrap}
.matrix thead th{font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--muted)}
.matrix tbody tr:last-child td{border-bottom:0}
.matrix td.lic{text-align:left;font-size:12.5px;color:var(--muted);min-width:220px}
.owned-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.owned-box h3{font-size:18px;margin-bottom:8px}
.owned-box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
@media (max-width:760px){ .owned-box{grid-template-columns:minmax(0,1fr)} }
.matrix .y{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--agent)}
.matrix .n{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line)}
.foot{font-size:12.5px;color:var(--muted);max-width:90ch}
.summary-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}

/* Slat transition */
.slats{position:fixed;inset:0;pointer-events:none;z-index:30;display:flex;flex-direction:column}
.slats i{flex:1;background:var(--slat);transform:scaleY(0);transform-origin:center}
.slats.run i{animation:slat .5s ease-in-out both}
@keyframes slat{0%{transform:scaleY(0)}45%,55%{transform:scaleY(1.02)}100%{transform:scaleY(0)}}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--agent-soft)}100%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion: reduce){ .slats{display:none} .msg.fresh,.line.fresh,.line.fresh .dot{animation:none} .msgs{scroll-behavior:auto} }

@media (max-width:1100px){ .grid{grid-template-columns:minmax(0,1fr) 320px} .console{grid-column:1 / -1} }
@media (max-width:760px){
  .grid,.hero,.persona,.outcomes,.summary-top{grid-template-columns:minmax(0,1fr)}
  .screen{height:480px}
  .hint{display:none}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tiles div{border-right:0;border-bottom:1px solid var(--line)}
}
</style>

</head>
<body>
<div class="bar" role="banner">
  <div class="bar-row">
    <div class="brand">3 Day Blinds <span>× Salesforce · customer journey</span></div>
    <div class="mode" role="group" aria-label="Experience">
      <button id="m-today" type="button" aria-pressed="false">Today</button>
      <button id="m-sf" type="button" aria-pressed="true">With Salesforce</button>
    </div>
    <div class="nav">
      <button class="btn" id="back" type="button">Back</button>
      <span class="count" id="count">1 / 12</span>
      <button class="btn primary" id="next" type="button">Next</button>
    </div>
    <span class="hint">Arrow keys also work</span>
  </div>
  <nav class="track" id="track" aria-label="Stages"></nav>
</div>

<main class="stage" id="stage" aria-live="polite"></main>
<div class="slats" id="slats" aria-hidden="true"></div>

<script>
/* Drop photos in here as data: URIs (or leave empty to show the slatted placeholder). */
const PHOTOS = {
  hero:     { src: "", label: "Living room with plantation shutters in afternoon light" },
  persona:  { src: "", label: "Homeowner portrait" },
  bare:     { src: "", label: "Empty living room with large bare windows" },
  consult:  { src: "", label: "Design consultant with client and fabric samples" },
  shipping: { src: "", label: "Boxes on a doorstep" },
  install:  { src: "", label: "Installer fitting a shade at a window" },
  finished: { src: "", label: "Bedroom with motorized roller shades" }
};

const PRODUCTS = {
  mc:    "Marketing Cloud Next",
  d360:  "Data 360",
  sales: "Agentforce Sales",
  cc:    "Agentforce Contact Center",
  fs:    "Agentforce Field Service"
};

/* From 3DB's current asset summary */
const LICENSED = {
  mc:    "New",
  d360:  "New",
  sales: "New: agents on top of today's CRM",
  cc:    "New: agents and voice on top of Digital Engagement and Knowledge",
  fs:    "New: agents on top of Field Service+, Contractor Plus and Appointment Assistant"
};

/* Helpers for messages (m) and console lines (c) */
const m = (kind, text, extra={}) => ({kind, text, ...extra});
const c = (kind, who, what, detail="") => ({kind, who, what, detail});

const SCREENS = [
  { type:"opener", label:"Start" },
  { type:"persona", label:"Customer" },

  { type:"stage", label:"Ask", n:1,
    title:"Jordan asks a question and gets an answer at 10pm",
    sf:"Jordan has just moved in and has four rooms of bare windows. On the website late at night, Jordan asks whether shutters work on a bay window. An agent answers, asks about rooms and timing, and qualifies the lead in the same conversation.",
    today:"The web form creates a lead in Salesforce. Nothing else happens until someone follows up or the consultant arrives.",
    why:"Leads contacted within an hour are far more likely to qualify than leads contacted later.",
    whySrc:"Harvard Business Review, “The Short Life of Online Sales Leads” (2011). Legacy benchmark from before AI agents.",
    chips:["Agentforce Sales · Piper","Data 360"], products:["sales","d360"],
    channel:"3 Day Blinds · Chat", contact:"Website · 10:04 pm",
    steps:[
      { msgs:[ m("in","Do shutters work on a bay window? Just moved in and have 4 rooms to do.") ],
        log:[ c("data","Data 360","New profile started","3 page views: shutters, motorized shades · source: local search"),
              c("agent","Piper · Agentforce Sales","Reads the question","Intent: product fit + new project") ] },
      { msgs:[ m("out","Yes. Bay windows are one of the most common shutter projects. Each panel is made to fit the angle of the bay. Which rooms are you thinking about, and do you have a timeline?",{who:"3DB Assistant"}) ],
        log:[ c("agent","Piper · Agentforce Sales","Answers from product knowledge","Grounded in 3DB product and installation content") ] },
      { msgs:[ m("in","Living room bay, 2 bedrooms and an office. Ideally before the holidays.") ],
        log:[ c("agent","Piper · Agentforce Sales","Qualifies the lead","4 rooms · shutters + motorized shades · timeline under 8 weeks"),
              c("sys","Agentforce Sales","Lead created and scored","High intent · preferred channel: text") ] },
      { msgs:[ m("out","Great. I can book a free in-home design consultation. What's your ZIP code?",{who:"3DB Assistant"}), m("in","80212") ],
        log:[ c("agent","Piper · Agentforce Sales","Hands off to scheduling","ZIP 80212 · passes rooms and products") ] }
    ],
    todayPhone:[ m("note","Form submitted · 10:04 pm"), m("note","No reply until business hours") ],
    manual:["Lead waits in a queue overnight","Someone calls back the next day to qualify","Room and product details captured by hand, if at all"],
    owned:[{"name": "Field Service+", "use": "The web form creates a lead record. Nobody responds until someone works the queue."}], gap:["Agentforce Sales · Piper", "Data 360"],
    stat:{ big:"Next day", text:"Typical first response to an after-hours web lead" }
  },

  { type:"stage", label:"Book", n:2,
    title:"Jordan gets a visit in two days, with the right consultant",
    sf:"The scheduling agent offers the soonest slots first. Optimization picks the best-fit design consultant for the ZIP code, the products Jordan wants, and each consultant's capacity. The Dispatch Center only steps in for exceptions.",
    today:"Customers see a 7-day window with every slot shown. The consultant is assigned at random, and the calendar locks 72 hours out.",
    why:"Earlier visits and better matches are the core of the Dispatch Center initiative.",
    whySrc:"3 Day Blinds pre-read, October 2026: estimated $27M opportunity (2025 baseline).",
    chips:["Agentforce Field Service · scheduling agent","Enhanced Scheduling and Optimization","Agentforce Sales"], products:["fs","sales"],
    channel:"3 Day Blinds · Chat", contact:"Website · 10:07 pm",

/* ---------- State and rendering ---------- */
const state = { i:0, step:0, mode:"sf" };
const stageEl = document.getElementById("stage");
const track = document.getElementById("track");
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

function photo(key, cls=""){
  const p = PHOTOS[key]; if(!p) return "";
  return `<div class="photo ${cls}">${p.src ? `<img src="${p.src}" alt="${esc(p.label)}">` : `<div class="ph"><span>Photo slot · ${esc(p.label)}</span></div>`}</div>`;
}

function msgHTML(x, fresh){
  const f = fresh ? " fresh" : "";
  if(x.kind==="note") return `<div class="msg note${f}">${esc(x.text)}</div>`;
  if(x.kind==="card") return `<div class="msg card${f}"><b>${esc(x.title)}</b>${x.rows.map(r=>`<div class="row"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join("")}</div>`;
  const who = x.who ? `<span class="who">${esc(x.who)}</span>` : "";
  const opts = x.opts ? `<div class="opts">${x.opts.map(o=>`<span class="${x.pick===o?'pick':''}">${esc(o)}</span>`).join("")}</div>` : "";
  return `<div class="msg ${x.kind}${f}">${who}${esc(x.text)}${opts}</div>`;
}

function lineHTML(l, fresh, idx){
  return `<li class="line ${l.kind}${fresh?' fresh':''}" style="${fresh?`animation-delay:${idx*0.18}s`:''}"><span class="dot"></span><div><div class="who">${esc(l.who)}</div><div class="what">${esc(l.what)}</div>${l.detail?`<div class="detail">${esc(l.detail)}</div>`:""}</div></li>`;
}

function renderTrack(){
  track.innerHTML = SCREENS.map((s,k)=>`<button type="button" data-k="${k}" class="${k===state.i?'on':k<state.i?'done':''}" aria-current="${k===state.i?'step':'false'}"><i></i><b>${s.n?s.n+'. ':''}${esc(s.label)}</b></button>`).join("");
  track.querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.k,0,true));
  const on = track.querySelector(".on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
}

function renderStage(s, freshStep){
  const sf = state.mode==="sf";
  const shown = sf ? s.steps.slice(0, state.step+1) : [];
  const msgs = sf
    ? shown.map((st,k)=>st.msgs.map(x=>msgHTML(x, k===freshStep)).join("")).join("")
    : s.todayPhone.map(x=>msgHTML(x,false)).join("");
  let lineIdx = 0;
  const lines = shown.map((st,k)=>st.log.map(l=>lineHTML(l, k===freshStep, k===freshStep?lineIdx++:0)).join("")).join("");
  const last = s.steps.length-1;

  return `<div class="grid">
    <section class="story">
      <span class="eyebrow">Stage ${s.n} of 9 · ${esc(s.label)}</span>
      <h2>${esc(s.title)}</h2>
      ${sf ? "" : `<span class="today-tag">Today</span>`}
      <p>${esc(sf ? s.sf : s.today)}</p>
      ${s.photo ? photo(s.photo) : ""}
      <div class="why"><strong>Why it matters</strong><span>${esc(s.why)}</span><small>${esc(s.whySrc)}</small></div>
      ${sf ? `<div class="chips"><em>New in this stage</em>${s.gap.map(x=>`<span class="chip new">${esc(x)}</span>`).join("")}</div>
        <div class="chips"><em>Builds on what you own</em>${s.owned.map(o=>`<span class="chip have">${esc(o.name)}</span>`).join("")}</div>` : ""}
    </section>
    <div class="phone-wrap ${sf?'':'dim'}">
      <div class="phone"><div class="screen">
        <div class="ph-head"><span class="notch"></span><b>${esc(s.channel)}</b><small>${esc(s.contact)}</small></div>
        ${msgs ? `<div class="msgs" id="msgs">${msgs}</div>` : `<div class="ph-empty">${sf?"The agents are working behind the scenes. Nothing for the customer to do yet.":"Nothing happens here today."}</div>`}
      </div></div>
      ${sf ? `<div class="stepper"><span class="count">Step ${state.step+1} of ${s.steps.length}</span>
        <button class="btn" type="button" id="stepnext">${state.step<last?"Next step":"Next stage"}</button>
        ${state.step<last?`<button class="btn" type="button" id="stepall">Show all</button>`:""}</div>` : ""}
    </div>
    <aside class="console" aria-label="${sf?'Agent activity':'Manual work today'}">
      ${sf ? `<div class="c-head"><span class="live"></span><h3>Behind the scenes</h3><small>agents · data · people</small></div>
        <ul class="lines">${lines || `<li class="line sys"><span class="dot"></span><div><div class="what">Waiting for the customer</div></div></li>`}</ul>
        <div class="legend"><span><i style="background:var(--agent)"></i>Agent</span><span><i style="background:var(--brass)"></i>Data</span><span><i style="background:var(--human)"></i>Person</span><span><i style="background:var(--muted)"></i>System</span><span><i style="background:var(--warn)"></i>Exception</span></div>`
      : `<div class="c-head"><h3>Manual work today</h3></div>
        <ul class="manual">${s.manual.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <div class="stat"><b>${esc(s.stat.big)}</b>${esc(s.stat.text)}</div>
        <div class="own">
          <h4>What you run on today</h4>
          <ul>${s.owned.map(o=>`<li><b>${esc(o.name)}</b><span>${esc(o.use)}</span></li>`).join("")}</ul>
        </div>`}
    </aside>
  </div>`;
}

function render(freshStep=-1){
  const s = SCREENS[state.i];
  let html = "";
  if(s.type==="opener") html = renderOpener();
  else if(s.type==="persona") html = renderPersona();
  else if(s.type==="summary") html = renderSummary();
  else html = renderStage(s, freshStep);
  stageEl.innerHTML = html;
  document.getElementById("count").textContent = `${state.i+1} / ${SCREENS.length}`;
  document.getElementById("back").disabled = state.i===0 && state.step===0;
  document.getElementById("next").disabled = state.i===SCREENS.length-1;
  document.getElementById("m-sf").setAttribute("aria-pressed", state.mode==="sf");
  document.getElementById("m-today").setAttribute("aria-pressed", state.mode==="today");
  renderTrack();
  const box = document.getElementById("msgs"); if(box) box.scrollTop = box.scrollHeight;
  const st = document.getElementById("start"); if(st) st.onclick = next;
  const sn = document.getElementById("stepnext"); if(sn) sn.onclick = next;
  const sa = document.getElementById("stepall"); if(sa) sa.onclick = () => { state.step = SCREENS[state.i].steps.length-1; render(); };
  try{ window.claude?.hot?.snapshot?.(()=>({...state})); }catch(e){}
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const slats = document.getElementById("slats");
slats.innerHTML = "<i></i>".repeat(14);
function wipe(fn){
  if(reduce){ fn(); return; }
  slats.classList.remove("run"); void slats.offsetWidth; slats.classList.add("run");
  setTimeout(fn, 230);
}

function go(i, step=0, transition=false){
  const doIt = () => { state.i = i; state.step = step; render(); window.scrollTo({top:0}); };
  transition ? wipe(doIt) : doIt();
}
function next(){
  const s = SCREENS[state.i];
  if(s.type==="stage" && state.mode==="sf" && state.step < s.steps.length-1){ state.step++; render(state.step); return; }
  if(state.i < SCREENS.length-1) go(state.i+1, 0, true);
}
function back(){
  const s = SCREENS[state.i];
  if(s.type==="stage" && state.mode==="sf" && state.step>0){ state.step--; render(); return; }
  if(state.i>0){ const p = SCREENS[state.i-1]; go(state.i-1, p.type==="stage" ? p.steps.length-1 : 0, true); }
}
function setMode(md){ state.mode = md; render(); }

document.getElementById("next").onclick = next;
document.getElementById("back").onclick = back;
document.getElementById("m-sf").onclick = () => setMode("sf");
document.getElementById("m-today").onclick = () => setMode("today");
document.addEventListener("keydown", e => {
  if(e.target.closest && e.target.closest("input,textarea")) return;
  if(e.key==="ArrowRight"){ e.preventDefault(); next(); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); back(); }
});

function start(data){
  if(data && typeof data.i==="number"){ state.i = Math.min(data.i, SCREENS.length-1); state.step = data.step||0; state.mode = data.mode==="today"?"today":"sf"; }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
